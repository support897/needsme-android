name: Android release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, like v2.4.0"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Write the fixed signing key
        env:
          A: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          B: ${{ secrets.NM_KEYSTORE_B64 }}
          PASS: ${{ secrets.NM_KS_PASS }}
        run: |
          for S in "$A" "$B"; do
            [ -z "$S" ] && continue
            echo "$S" | base64 --decode > /tmp/key.jks
            if keytool -list -keystore /tmp/key.jks -storepass "$PASS" -alias needsme >/dev/null 2>&1; then echo "key ok"; echo "NM_KEYSTORE=/tmp/key.jks" >> $GITHUB_ENV; echo "NM_KS_PASS=$PASS" >> $GITHUB_ENV; exit 0; fi
          done
          echo "no working key"; exit 1
      - name: Build signed APK
        run: gradle --no-daemon assembleRelease
      - name: Check it has the same signing key as the last release (so phones can update)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" NeedsMe-Android.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          NEW=$($BT/apksigner verify --print-certs NeedsMe-Android.apk | grep "SHA-256" | head -1)
          curl -sL -o old.apk https://github.com/support897/needsme-android/releases/download/v2.3.1/NeedsMe-Android.apk
          OLD=$($BT/apksigner verify --print-certs old.apk | grep "SHA-256" | head -1)
          echo "new: $NEW"; echo "old: $OLD"
          [ "$NEW" = "$OLD" ] || { echo "SIGNING KEY DIFFERS"; exit 1; }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" NeedsMe-Android.apk --title "NeedsMe Android ${{ inputs.tag }}" --notes "Shared AI list, workforce and MCP cards, Polar in the AI list." --target "${{ github.sha }}"
